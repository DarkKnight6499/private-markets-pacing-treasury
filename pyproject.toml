[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "private-markets-pacing-treasury"
version = "0.1.0"
description = "Synthetic private markets capital planning and liquidity analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
authors = []
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
